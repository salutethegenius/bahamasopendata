# =============================================================================
# Methodology gates — these are enforced by the scrapers, not just documented
# =============================================================================

methodology:
  scraping_rules:
    public_only: true                    # never use authenticated sessions
    rate_limit_seconds_min: 2            # minimum between requests to same host
    user_agent: "BahamasOpenDataBot/1.0 (+https://bahamasopendata.com/intelligence)"
    respect_robots_txt: true
    attribution_required: true           # every data point cites its source URL + timestamp

  data_retention:
    raw_snapshots_days: 730              # keep raw HTML/JSON for 2 years for auditability
    normalized_indefinite: true          # the published dataset never expires

  delta_validation:
    rival_iq_trial_window: "2026-09-14 to 2026-09-27"
    semrush_trial_window: "2026-09-21 to 2026-09-27"
    purpose: "Cross-check our scraped values against commercial tooling; flag variances over 5% for manual review before lockdown."
